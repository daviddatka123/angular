<header class="header">
  <div class="logo">
    <span class="step-text">Step</span>
    <span class="ordering-text">Ordering</span>
  </div>

  <input [(ngModel)]="name" placeholder="name" />
  <input [(ngModel)]="email" placeholder="email" />
  <button (click)="test()">send</button>

  <nav class="nav-links">
    <a routerLink="/" class="nav-item">Home</a>

    <ng-container *ngIf="!authService.isLoggedIn()">
      <a routerLink="/sign-in" class="nav-item">Sign In</a>
      <a routerLink="/register" class="btn-register">Register</a>
    </ng-container>

    <ng-container *ngIf="authService.isLoggedIn()">
      <a routerLink="/profile" class="btn-register">Profile</a>
    </ng-container>

    <div class="cart-container" routerLink="/cart">
      <div class="cart-badge">
        <span>Cart ({{ cartService.cartItems().length }})</span>
      </div>
    </div>
  </nav>
</header>
